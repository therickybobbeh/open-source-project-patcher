[project]
name = "patcher"
version = "0.1.0"
description = "Rebuild upstream OSS projects from source with patched dependencies, run their tests, and publish patched images"
requires-python = ">=3.11"
dependencies = [
  "packaging>=24,<27",
  "pydantic>=2.9,<3",
  "pyyaml>=6.0.2,<7",
  "typer>=0.15,<1",
]

[project.scripts]
patcher = "patcher.cli:app"

[dependency-groups]
dev = ["pytest>=9.1.1,<10"]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
