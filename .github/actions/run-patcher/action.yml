name: run-patcher
description: >-
  Build the patcher image from this commit (layer-cached) and run one `patcher` command in it.
  Paths are mounted at identical host/container locations so docker compose files and
  Testcontainers bind mounts resolve the same on both sides.
inputs:
  args:
    description: Arguments for the `patcher` CLI
    required: true
  cache-key:
    description: Key for the toolchain/module caches (mise, Go, Cargo, Maven, Trivy DB); empty = no cache
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build patcher image
      shell: bash
      run: >-
        docker buildx build --load -t patcher:ci
        --cache-from type=gha,scope=patcher-image --cache-to type=gha,mode=max,scope=patcher-image
        "$GITHUB_WORKSPACE/patcher"

    - name: Restore toolchain caches
      if: inputs.cache-key != ''
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ runner.temp }}/patcher-cache
        key: patcher-${{ runner.arch }}-${{ inputs.cache-key }}-${{ github.run_id }}
        restore-keys: |
          patcher-${{ runner.arch }}-${{ inputs.cache-key }}-

    - name: patcher ${{ inputs.args }}
      shell: bash
      env:
        ARGS: ${{ inputs.args }}
      run: |
        cache="$RUNNER_TEMP/patcher-cache"
        mkdir -p "$cache"/{mise,go,cargo,rustup,m2,trivy} "$RUNNER_TEMP/work" "$HOME/.docker"
        # ARGS is built by our workflows from recipe/line names only; word splitting is intended
        # shellcheck disable=SC2086
        docker run --rm --network host \
          -e PATCHER_REGISTRY -e GITHUB_ACTIONS -e WORK="$RUNNER_TEMP/work" \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -v "$HOME/.docker:/root/.docker" \
          -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
          -v "$RUNNER_TEMP/work:$RUNNER_TEMP/work" \
          -v "$cache/mise:/opt/mise" -v "$cache/go:/opt/go" -v "$cache/cargo:/opt/cargo" \
          -v "$cache/rustup:/opt/rustup" -v "$cache/m2:/root/.m2" -v "$cache/trivy:/opt/trivy-cache" \
          patcher:ci $ARGS
