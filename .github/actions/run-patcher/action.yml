name: run-patcher
description: >-
  Build the patcher image from this commit (layer-cached) and run one `patcher` command in it.
  Paths are mounted at identical host/container locations so docker compose files and
  Testcontainers bind mounts resolve the same on both sides.
inputs:
  args:
    description: Arguments for the `patcher` CLI
    required: true
  cache-key:
    description: Key for the toolchain/module caches (mise, Go, Cargo, Maven, Gradle, npm, uv, Trivy DB); empty = no cache
    required: false
    default: ""
  image-cache:
    description: >-
      "false": build the patcher image without the GitHub Actions layer cache. For jobs that hold credentials or whose
      output is released: every job on the branch can write that cache, including jobs that run upstream code, so
      reading it could run their binaries here. Such jobs also leave `cache-key` empty, for the same reason.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build patcher image
      shell: bash
      env:
        IMAGE_CACHE: ${{ inputs.image-cache }}
      run: |
        cache=""
        if [ "$IMAGE_CACHE" != false ]; then
          cache="--cache-from type=gha,scope=patcher-image --cache-to type=gha,mode=max,scope=patcher-image"
        fi
        # shellcheck disable=SC2086  # two flags, or none
        docker buildx build --load -t patcher:ci $cache "$GITHUB_WORKSPACE/patcher"

    - name: Restore toolchain caches
      if: inputs.cache-key != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/patcher-cache
        key: patcher-${{ runner.arch }}-${{ inputs.cache-key }}-${{ github.run_id }}
        restore-keys: |
          patcher-${{ runner.arch }}-${{ inputs.cache-key }}-

    - name: patcher ${{ inputs.args }}
      shell: bash
      env:
        ARGS: ${{ inputs.args }}
      run: |
        # same container setup as a local run: scripts/patcher-docker.sh
        # ARGS is built by our workflows from recipe/line names only; word splitting is intended
        # shellcheck disable=SC2086
        PATCHER_IMAGE=patcher:ci PATCHER_CACHE="$RUNNER_TEMP/patcher-cache" PATCHER_WORK="$RUNNER_TEMP/work" \
          "$GITHUB_WORKSPACE/scripts/patcher-docker.sh" $ARGS

    # The container runs as root, so what it writes into the checkout (out/, state/) is root-owned, and later
    # steps can't move it: open-pr's stash failed with "Permission denied" on the state/<recipe>/ directory the
    # release created, and all six releases of 2026-10-29 05:00 stopped there. Give it back to the runner's user.
    - name: Give the checkout back to the runner user
      if: always()
      shell: bash
      # with the patcher image rather than sudo, which self-hosted runners often don't allow
      run: |
        docker image inspect patcher:ci >/dev/null 2>&1 || exit 0  # the image never built: the container wrote nothing
        docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --entrypoint chown patcher:ci -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
