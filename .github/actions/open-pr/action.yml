name: open-pr
description: >-
  Open or update a pull request with the repository's GitHub App, so that the PR's own checks run.
  Until the App is configured (vars.PATCHER_APP_ID empty), fall back to GITHUB_TOKEN with a warning.
  PRs from that token don't trigger workflows, and the repository must allow GitHub Actions to create
  pull requests (Settings → Actions → General → Workflow permissions). The calling job needs
  `contents: write` and `pull-requests: write` for the fallback.
inputs:
  app-id:
    description: vars.PATCHER_APP_ID (empty = use GITHUB_TOKEN)
    required: false
    default: ""
  private-key:
    description: secrets.PATCHER_APP_PRIVATE_KEY
    required: false
    default: ""
  branch:
    required: true
  add-paths:
    required: true
  commit-message:
    required: true
  title:
    required: true
  body-path:
    required: true
  labels:
    required: false
    default: automated
  draft:
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - id: app-token
      if: inputs.app-id != ''
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
    - if: inputs.app-id == ''
      shell: bash
      run: >-
        echo "::warning::vars.PATCHER_APP_ID is not set: opening the PR with GITHUB_TOKEN, so its checks won't run.
        Set up the GitHub App (docs/runbook.md, One-time setup)."
    # create-pull-request branches from this checkout: the commit that started the run. When main has moved on
    # since with workflow changes (merges during an hour-long run), GitHub refuses the token a branch whose
    # workflow files differ from main's ("Resource not accessible by integration" on creating the ref; all six
    # releases of 2026-10-29 failed this way). So the changes move onto the latest commit of the branch first.
    # The paths each caller commits are written by one run per line at a time, so they don't conflict.
    - shell: bash
      env:
        TOKEN: ${{ steps.app-token.outputs.token || github.token }}
      run: |
        branch=$(git rev-parse --abbrev-ref HEAD)
        [ "$branch" != HEAD ] || exit 0  # detached: no base to move to
        auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
        git -c "http.https://github.com/.extraheader=$auth" fetch -q --no-tags origin "$branch"
        [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ] || exit 0
        echo "$branch moved on since this run started: moving the changes onto $(git rev-parse --short FETCH_HEAD)"
        dirty=$(git status --porcelain)
        [ -z "$dirty" ] || git stash push -q --include-untracked
        git checkout -q -B "$branch" FETCH_HEAD
        [ -z "$dirty" ] || git stash pop -q
    - id: cpr
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        token: ${{ steps.app-token.outputs.token || github.token }}
        branch: ${{ inputs.branch }}
        delete-branch: true
        add-paths: ${{ inputs.add-paths }}
        commit-message: ${{ inputs.commit-message }}
        title: ${{ inputs.title }}
        body-path: ${{ inputs.body-path }}
        draft: ${{ inputs.draft }}
        labels: ${{ inputs.labels }}
        sign-commits: true
    # create-pull-request sets the draft state only when it opens the PR: a line whose tests failed once would
    # stay a draft after a run that passes (redis, #9), and one that starts failing would stay ready for review
    - if: steps.cpr.outputs.pull-request-operation == 'updated'
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        GH_REPO: ${{ github.repository }}
        PR: ${{ steps.cpr.outputs.pull-request-number }}
        DRAFT: ${{ inputs.draft }}
      run: |
        if [ "$(gh pr view "$PR" --json isDraft --jq .isDraft)" != "$DRAFT" ]; then
          if [ "$DRAFT" = true ]; then gh pr ready "$PR" --undo; else gh pr ready "$PR"; fi
        fi
