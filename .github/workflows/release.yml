# Release flow: when a reviewed patch set lands in generated/, rebuild it per platform on native
# runners, merge, Copa, sign, attest, push to GHCR, and open a PR recording the release in state/.
name: release

on:
  push:
    branches: [main]
    paths: ["generated/**"]
  workflow_dispatch:
    inputs:
      recipe:
        description: Recipe name
        required: true
      line:
        description: Release line key
        required: true

permissions:
  contents: read

env:
  PATCHER_REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          RECIPE: ${{ inputs.recipe }}
          LINE: ${{ inputs.line }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            matrix=$(jq -cn --arg r "$RECIPE" --arg l "$LINE" '{include: [{recipe: $r, line: $l}]}')
          else
            # every generated/<recipe>/<tag>/bump-plan.json touched by this push (deletions ignored)
            matrix=$(git diff --name-only --diff-filter=AM "$BEFORE" HEAD -- 'generated/*/*/bump-plan.json' \
              | xargs -r -n1 jq -c '{recipe, line}' | jq -sc '{include: unique}')
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$(jq '.include | length' <<<"$matrix")" >> "$GITHUB_OUTPUT"
          jq . <<<"$matrix"

  build:
    needs: plan
    if: needs.plan.outputs.count != '0'
    strategy:
      fail-fast: true
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.matrix).include }}
        arch:
          - { platform: linux/amd64, runner: ubuntu-24.04 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 240
    name: build ${{ matrix.target.recipe }} ${{ matrix.target.line }} ${{ matrix.arch.platform }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/run-patcher
        with:
          args: >-
            release-build ${{ matrix.target.recipe }} --line ${{ matrix.target.line }}
            --platform ${{ matrix.arch.platform }} --out out --workdir ${{ runner.temp }}/work
          cache-key: ${{ matrix.target.recipe }}

  publish:
    needs: [plan, build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    name: publish ${{ matrix.recipe }} ${{ matrix.line }}
    concurrency:
      group: publish-${{ matrix.recipe }}-${{ matrix.line }}
      cancel-in-progress: false
    permissions:
      contents: write       # only used by the GITHUB_TOKEN fallback in open-pr (the state PR)
      pull-requests: write
      packages: write
      id-token: write       # keyless cosign
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0  (Copa runs package managers per arch)
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/run-patcher
        with:
          args: publish ${{ matrix.recipe }} --line ${{ matrix.line }} --out out
          cache-key: ${{ matrix.recipe }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign + attach SBOM and OpenVEX
        env:
          RELEASE: out/${{ matrix.recipe }}/${{ matrix.line }}/release.json
        run: |
          jq -c '.[]' "$RELEASE" | while read -r img; do
            ref="$(jq -r '.repository + "@" + .digest' <<<"$img")"
            scripts/retry.sh 3 cosign sign --yes "$ref"
            docker run --rm -v "$PWD:$PWD" -w "$PWD" -v "$HOME/.docker:/root/.docker" --entrypoint trivy patcher:ci \
              image --format cyclonedx --output "$PWD/sbom.cdx.json" "$ref"
            scripts/retry.sh 3 cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$ref"
            scripts/retry.sh 3 cosign attest --yes --type openvex --predicate "$(jq -r .vex <<<"$img")" "$ref"
            echo "$(jq -r .image <<<"$img")=$(jq -r .digest <<<"$img")" >> digests.txt
          done
          cat digests.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.recipe }}-${{ matrix.line }}
          path: out/${{ matrix.recipe }}/${{ matrix.line }}/release.json
      - uses: ./.github/actions/open-pr
        with:
          app-id: ${{ vars.PATCHER_APP_ID }}
          private-key: ${{ secrets.PATCHER_APP_PRIVATE_KEY }}
          branch: state/${{ matrix.recipe }}/${{ matrix.line }}
          add-paths: state/${{ matrix.recipe }}.yaml
          commit-message: "state: released ${{ matrix.recipe }} ${{ matrix.line }}"
          title: "[${{ matrix.recipe }}] record release of ${{ matrix.line }}"
          body-path: out/${{ matrix.recipe }}/${{ matrix.line }}/release.json
          labels: automated, release

  # one provenance attestation per image (attest-build-provenance takes a single registry subject)
  subjects:
    needs: publish
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: releases
      - id: m
        run: |
          echo "matrix=$(jq -sc '{include: [.[][] | {repository, digest, image}]}' releases/*/release.json)" >> "$GITHUB_OUTPUT"

  attest:
    needs: subjects
    runs-on: ubuntu-24.04
    strategy:
      matrix: ${{ fromJSON(needs.subjects.outputs.matrix) }}
    name: provenance ${{ matrix.image }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ matrix.repository }}
          subject-digest: ${{ matrix.digest }}
          push-to-registry: true
