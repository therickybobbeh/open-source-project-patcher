# Release flow: when a reviewed patch set lands in generated/, rebuild it per platform on native runners, push the
# per-arch images to GHCR, merge them, Copa, sign, attest, and open a PR recording the release in state/.
#
# Trust boundary (docs/architecture.md). `build` runs upstream code (build commands, Dockerfile RUN steps) with the
# Docker socket, i.e. as root on its runner, so it is treated as hostile: no registry login, read-only permissions, no
# caches (any job on the branch can write those). Its images leave it only as archives (artifacts). The jobs after it
# run no upstream code and hold the credentials; of everything the build jobs could have written they read only
# those archives, as data: `patcher release-push` computes every tag itself and pushes nothing else.
#
# One run releases one line: a push that lands several patch sets dispatches a run per line, because any job can
# write any artifact of its own run, and one project's build must not be able to swap another project's archives.
#
# A run that failed after its builds is finished without rebuilding: dispatch it with `rebuild: false`
# (docs/runbook.md, "A release failed after the builds").
name: release

on:
  push:
    branches: [main]
    paths: ["generated/**"]
  workflow_dispatch:
    inputs:
      recipe:
        description: Recipe name
        required: true
      line:
        description: Release line key
        required: true
      rebuild:
        description: >-
          Build the patch set (default). Untick to only finish the newest revision whose per-arch images are already in
          the registry, after a run that failed past its builds
        type: boolean
        default: true

permissions:
  contents: read

env:
  PATCHER_REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  plan:
    runs-on: ${{ fromJSON(vars.PATCHER_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write         # a push that lands several patch sets dispatches one run per line
    outputs:
      count: ${{ steps.plan.outputs.count }}
      recipe: ${{ steps.plan.outputs.recipe }}
      line: ${{ steps.plan.outputs.line }}
      build: ${{ steps.plan.outputs.build }}
      arches: ${{ steps.plan.outputs.arches }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false   # this job starts releases: it reads no cache other jobs can write
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          RECIPE: ${{ inputs.recipe }}
          LINE: ${{ inputs.line }}
          REBUILD: ${{ inputs.rebuild }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # `patcher release-plan`: the line, whether anything is built (not for image-only recipes), and its platforms
          # (build.platforms, narrowed by the images' own `platforms`), each with its native runner. Recipes with
          # `publish: false` and components are never released.
          if [ "$EVENT" = workflow_dispatch ]; then
            plan=$(uv run --project patcher --frozen patcher release-plan --recipe "$RECIPE" --line "$LINE")
          else
            # the patch sets (generated/<recipe>/<tag>/bump-plan.json) this push added or changed; deletions are ignored
            git diff --name-only --diff-filter=AM "$BEFORE" HEAD > "$RUNNER_TEMP/changed"
            plan=$(uv run --project patcher --frozen patcher release-plan --changed-files "$RUNNER_TEMP/changed")
          fi
          jq . <<<"$plan"
          jq -r '.skipped[] | "::notice::not released: \(.recipe) \(.line) (\(.reason))"' <<<"$plan"
          jq -r '.errors[] | "::error::cannot release \(.recipe) \(.line): \(.error)"' <<<"$plan"
          errors=$(jq '.errors | length' <<<"$plan")
          count=$(jq '.include | length' <<<"$plan")
          if [ "$count" -gt 1 ] || { [ "$count" -eq 1 ] && [ "$errors" -gt 0 ]; }; then
            # one run per line (see the top of this file), and this run fails below if any line can't be released:
            # the lines that can are dispatched first, so they aren't held up
            jq -r '.include[] | [.recipe, .line] | @tsv' <<<"$plan" | while IFS=$'\t' read -r recipe line; do
              gh workflow run release.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f recipe="$recipe" -f line="$line"
              echo "::notice::dispatched a release run for $recipe $line"
            done
            count=0
          fi
          target='{}'
          if [ "$count" = 1 ]; then target=$(jq -c '.include[0]' <<<"$plan"); fi
          build=$(jq -r '.build // false' <<<"$target")
          # `rebuild: false`: nothing is built or pushed; publish finishes the newest revision that is in the registry
          if [ "$REBUILD" = false ]; then build=false; fi
          {
            echo "count=$count"
            echo "recipe=$(jq -r '.recipe // ""' <<<"$target")"
            echo "line=$(jq -r '.line // ""' <<<"$target")"
            echo "build=$build"
            echo "arches=$(jq -c '.arches // []' <<<"$target")"
          } >> "$GITHUB_OUTPUT"
          [ "$errors" -eq 0 ]   # a line that can't be released fails the run (a CI alert), after the others

  # Runs upstream code with the Docker socket: no login, no write permission, no caches (see the top of this file).
  # It pushes nothing (it has nothing to push with); the images it built leave it as archives.
  build:
    needs: plan
    if: needs.plan.outputs.count == '1' && needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: true
      matrix:
        arch: ${{ fromJSON(needs.plan.outputs.arches) }}
    runs-on: ${{ fromJSON(matrix.arch.arch == 'arm64' && (vars.PATCHER_RUNS_ON_UPSTREAM_ARM64 || vars.PATCHER_RUNS_ON_ARM64 || '"ubuntu-24.04-arm"') || (vars.PATCHER_RUNS_ON_UPSTREAM || vars.PATCHER_RUNS_ON || '"ubuntu-24.04"')) }}
    timeout-minutes: 240
    name: build ${{ needs.plan.outputs.recipe }} ${{ needs.plan.outputs.line }} ${{ matrix.arch.platform }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-patcher
        with:
          args: >-
            release-build ${{ needs.plan.outputs.recipe }} --line ${{ needs.plan.outputs.line }}
            --platform ${{ matrix.arch.platform }} --out out --workdir ${{ runner.temp }}/work
          image-cache: "false"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images-${{ needs.plan.outputs.recipe }}-${{ needs.plan.outputs.line }}-${{ matrix.arch.arch }}
          path: out/${{ needs.plan.outputs.recipe }}/${{ needs.plan.outputs.line }}/images/
          if-no-files-found: error
          retention-days: 3
          overwrite: true    # a re-run of this job replaces its own archives

  # No upstream code; may push. `patcher release-push` takes the next revision that has no tag yet, checks that each
  # archive holds one image of its platform before pushing any, and pushes each to `<final>-<arch>`, a tag it computes
  # from the recipe. It never overwrites a tag.
  push:
    needs: [plan, build]
    if: needs.plan.outputs.count == '1' && needs.plan.outputs.build == 'true'
    runs-on: ${{ fromJSON(vars.PATCHER_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 30
    name: push ${{ needs.plan.outputs.recipe }} ${{ needs.plan.outputs.line }}
    concurrency:
      group: release-push-${{ needs.plan.outputs.recipe }}-${{ needs.plan.outputs.line }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      revision: ${{ steps.pushed.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: images-${{ needs.plan.outputs.recipe }}-${{ needs.plan.outputs.line }}-*
          path: out/${{ needs.plan.outputs.recipe }}/${{ needs.plan.outputs.line }}/images
          merge-multiple: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/run-patcher
        with:
          args: release-push ${{ needs.plan.outputs.recipe }} --line ${{ needs.plan.outputs.line }} --out out
          image-cache: "false"
      - id: pushed
        env:
          PUSHED: out/${{ needs.plan.outputs.recipe }}/${{ needs.plan.outputs.line }}/pushed.json
        run: echo "revision=$(jq -r .revision "$PUSHED")" >> "$GITHUB_OUTPUT"

  publish:
    needs: [plan, push]
    # after `push`, or right away when this run builds nothing (image-only recipes, `rebuild: false`)
    if: >-
      !cancelled() && needs.plan.outputs.count == '1'
      && (needs.push.result == 'success' || needs.plan.outputs.build == 'false')
    runs-on: ${{ fromJSON(vars.PATCHER_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 120
    name: publish ${{ needs.plan.outputs.recipe }} ${{ needs.plan.outputs.line }}
    concurrency:
      group: publish-${{ needs.plan.outputs.recipe }}-${{ needs.plan.outputs.line }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write       # keyless cosign
    outputs:
      subjects: ${{ steps.record.outputs.subjects }}
      count: ${{ steps.record.outputs.count }}
      state: ${{ steps.record.outputs.state }}
      release: ${{ steps.record.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0  (Copa runs package managers per arch)
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # With `--revision`: the one `push` just pushed. A final tag that exists then belongs to something else (a Copa
      # refresh took the revision) and nothing is published, unless this is a re-run of this job (--finish-existing).
      # Without (nothing built in this run): the newest revision whose per-arch images all exist, where an image whose
      # final tag exists already (an earlier publish got that far) is kept as it is.
      - uses: ./.github/actions/run-patcher
        with:
          args: >-
            publish ${{ needs.plan.outputs.recipe }} --line ${{ needs.plan.outputs.line }} --out out
            ${{ needs.push.outputs.revision && format('--revision {0}', needs.push.outputs.revision) || '' }}
            ${{ github.run_attempt != '1' && '--finish-existing' || '' }}
          image-cache: "false"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign + attach SBOM and OpenVEX
        timeout-minutes: 30  # Sigstore can hang; cosign's retries fit well inside this
        env:
          RELEASE: out/${{ needs.plan.outputs.recipe }}/${{ needs.plan.outputs.line }}/release.json
        run: |
          # only what an image doesn't have yet from this workflow: finishing a revision an earlier run signed must not
          # leave a second signature, SBOM or (different) VEX document on the same digest
          identity="^https://github\.com/${GITHUB_REPOSITORY//./\\.}/\.github/workflows/release\.yml@"
          has() {
            cosign "$@" --certificate-identity-regexp "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$ref" > /dev/null 2>&1
          }
          jq -c '.[]' "$RELEASE" | while read -r img; do
            ref="$(jq -r '.repository + "@" + .digest' <<<"$img")"
            if has verify; then echo "$ref: signed already"; else scripts/retry.sh 3 cosign sign --yes "$ref"; fi
            if has verify-attestation --type cyclonedx; then echo "$ref: SBOM attached already"; else
              docker run --rm -v "$PWD:$PWD" -w "$PWD" -v "$HOME/.docker:/root/.docker" --entrypoint trivy patcher:ci \
                image --format cyclonedx --output "$PWD/sbom.cdx.json" "$ref"
              scripts/retry.sh 3 cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$ref"
            fi
            if has verify-attestation --type openvex; then echo "$ref: OpenVEX attached already"; else
              scripts/retry.sh 3 cosign attest --yes --type openvex --predicate "$(jq -r .vex <<<"$img")" "$ref"
            fi
          done
      # What the next jobs need, as job outputs: a later job could replace an artifact of this run, not another job's
      # outputs. One provenance attestation per image (attest-build-provenance takes a single registry subject).
      - id: record
        env:
          RELEASE: out/${{ needs.plan.outputs.recipe }}/${{ needs.plan.outputs.line }}/release.json
          STATE: state/${{ needs.plan.outputs.recipe }}/${{ needs.plan.outputs.line }}.yaml
        run: |
          subjects=$(jq -c '{include: [.[] | {repository, digest, image}]}' "$RELEASE")
          jq . <<<"$subjects"
          {
            echo "subjects=$subjects"
            echo "count=$(jq '.include | length' <<<"$subjects")"
            echo "state=$(base64 -w0 "$STATE")"
            echo "release=$(base64 -w0 "$RELEASE")"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.plan.outputs.recipe }}-${{ needs.plan.outputs.line }}   # for people; no job reads it
          path: |
            out/${{ needs.plan.outputs.recipe }}/${{ needs.plan.outputs.line }}/release.json
            state/${{ needs.plan.outputs.recipe }}/${{ needs.plan.outputs.line }}.yaml
          if-no-files-found: error
          overwrite: true

  attest:
    needs: publish
    # `!cancelled()`: when this run built nothing, `push` was skipped, and a plain condition would skip this job too
    # (GitHub's implied success() also looks at the jobs `publish` needs)
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.publish.outputs.count != '0' }}
    runs-on: ${{ fromJSON(vars.PATCHER_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    strategy:
      matrix: ${{ fromJSON(needs.publish.outputs.subjects) }}
    name: provenance ${{ matrix.image }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      # finishing a revision an earlier run attested must not attest it a second time
      - id: has
        env:
          GH_TOKEN: ${{ github.token }}
          SUBJECT: oci://${{ matrix.repository }}@${{ matrix.digest }}
        run: |
          if gh attestation verify "$SUBJECT" -R "$GITHUB_REPOSITORY" \
               --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" > /dev/null 2>&1; then
            echo "$SUBJECT: provenance attested already"
            echo "attested=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.has.outputs.attested != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.has.outputs.attested != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ matrix.repository }}
          subject-digest: ${{ matrix.digest }}
          push-to-registry: true

  # Last, so state/ only ever records complete releases (signed, SBOM, VEX, provenance). Whatever fails before this
  # leaves an unrecorded revision, which a run with `rebuild: false` finishes.
  state:
    needs: [plan, publish, attest]
    if: ${{ !cancelled() && needs.attest.result == 'success' }}   # see attest
    runs-on: ${{ fromJSON(vars.PATCHER_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    name: state ${{ needs.plan.outputs.recipe }} ${{ needs.plan.outputs.line }}
    concurrency:
      group: state-${{ needs.plan.outputs.recipe }}-${{ needs.plan.outputs.line }}
      cancel-in-progress: false
    permissions:
      contents: write       # only used by the GITHUB_TOKEN fallback in open-pr (the state PR)
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the line's state file and the release record, from publish's outputs (see there)
      - env:
          STATE: ${{ needs.publish.outputs.state }}
          RELEASE: ${{ needs.publish.outputs.release }}
          TO: state/${{ needs.plan.outputs.recipe }}/${{ needs.plan.outputs.line }}.yaml
        run: |
          mkdir -p "$(dirname "$TO")"
          base64 -d <<<"$STATE" > "$TO"
          base64 -d <<<"$RELEASE" > "$RUNNER_TEMP/release.json"
          git status --short
      - uses: ./.github/actions/open-pr
        with:
          app-id: ${{ vars.PATCHER_APP_ID }}
          private-key: ${{ secrets.PATCHER_APP_PRIVATE_KEY }}
          branch: state/${{ needs.plan.outputs.recipe }}/${{ needs.plan.outputs.line }}
          add-paths: state/${{ needs.plan.outputs.recipe }}/${{ needs.plan.outputs.line }}.yaml
          commit-message: "state: released ${{ needs.plan.outputs.recipe }} ${{ needs.plan.outputs.line }}"
          title: "[${{ needs.plan.outputs.recipe }}] record release of ${{ needs.plan.outputs.line }}"
          body-path: ${{ runner.temp }}/release.json
          labels: automated, release
