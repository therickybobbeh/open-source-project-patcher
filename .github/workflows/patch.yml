# PR flow: find release lines that need work, patch + test + build + Copa each one (no secrets,
# no pushes: upstream build/test code is untrusted), then open/update one PR per line with the
# generated patch set and report. Merging that PR triggers release.yml.
name: patch

on:
  schedule:
    - cron: "17 3 * * *"   # nightly: new upstream releases
  workflow_dispatch:
    inputs:
      recipe:
        description: Recipe name (empty = every line with a new upstream release)
        required: false
      line:
        description: Release line key (empty = every line of the recipe)
        required: false
      all:
        description: Re-run every line of every recipe
        type: boolean
        default: false
  # patcher/ changes are not a trigger: every Dependabot merge would re-run every line. patcher-image.yml
  # tests the code; dispatch with `all` to re-run everything on purpose.
  push:
    branches: [main]
    paths: ["recipes/**", "skips/**", "patches/**", "vex/**"]

permissions:
  contents: read

env:
  PATCHER_PLATFORMS: ${{ vars.PATCHER_PLATFORMS }}   # e.g. linux/arm64: only these platforms (unset: each recipe's)

# GitHub keeps only one *pending* run per group, so a shared group for pushes made the newest push cancel the
# pending run of the previous one (two recipe merges in a minute dropped the first recipe's run). Pushes get a
# group per commit; same-line work is still serialized by the patch job's per-line group below.
concurrency:
  group: patch-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || format('{0}-{1}', inputs.recipe || 'all', inputs.line || 'all') }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ${{ fromJSON(vars.PATCHER_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read          # scheduled runs skip lines another run is patching right now
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Runner pools are kept apart
        env:
          PATCHER_RUNS_ON: ${{ vars.PATCHER_RUNS_ON }}
          PATCHER_RUNS_ON_ARM64: ${{ vars.PATCHER_RUNS_ON_ARM64 }}
          PATCHER_RUNS_ON_UPSTREAM: ${{ vars.PATCHER_RUNS_ON_UPSTREAM }}
          PATCHER_RUNS_ON_UPSTREAM_ARM64: ${{ vars.PATCHER_RUNS_ON_UPSTREAM_ARM64 }}
        run: scripts/check-runner-pools.sh
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false  # no shared cache: patch jobs, which run upstream code, can write it
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          RECIPE: ${{ inputs.recipe }}
          LINE: ${{ inputs.line }}
          ALL: ${{ inputs.all }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [ "$EVENT" = workflow_dispatch ] && [ -n "$RECIPE" ]; then args+=(--recipe "$RECIPE");
          elif [ "$ALL" = true ]; then args+=(--all);
          elif [ "$EVENT" = push ]; then git diff --name-only "$BEFORE" HEAD > "$RUNNER_TEMP/changed"; args+=(--changed-files "$RUNNER_TEMP/changed" --before "$BEFORE"); fi
          matrix=$(uv run --project patcher --frozen patcher plan "${args[@]}")
          if [ -n "$LINE" ]; then matrix=$(jq -c --arg l "$LINE" '{include: [.include[] | select(.line == $l)]}' <<<"$matrix"); fi
          if [ "$EVENT" = schedule ]; then
            # lines another patch run is working on right now: the nightly run doesn't start duplicates
            # (lines whose patch set for the upstream tag is in a PR, open or merged, were skipped by `patcher plan`)
            busy=$(for s in queued in_progress; do
                     gh api "repos/$GITHUB_REPOSITORY/actions/workflows/patch.yml/runs?status=$s&per_page=50" \
                       --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID) | .id"; done \
                   | xargs -r -I{} gh api "repos/$GITHUB_REPOSITORY/actions/runs/{}/jobs?per_page=100" \
                       --jq '.jobs[] | select(.status != "completed") | .name' \
                   | sed -n 's/^patch //p' | jq -Rsc 'split("\n") | map(select(length > 0))')
            matrix=$(jq -c --argjson busy "${busy:-[]}" \
              '{include: [.include[] | select((.recipe + " " + .line) as $k | $busy | index($k) | not)]}' <<<"$matrix")
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$(jq '.include | length' <<<"$matrix")" >> "$GITHUB_OUTPUT"
          jq . <<<"$matrix"

  # Builds and tests on the platform `patcher plan` picked for the line (the first it is released for, so amd64 unless
  # PATCHER_PLATFORMS or the recipe say otherwise), on that platform's own runner: natively, without emulation.
  patch:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ${{ fromJSON(matrix.arch == 'arm64' && (vars.PATCHER_RUNS_ON_UPSTREAM_ARM64 || '"ubuntu-24.04-arm"') || (vars.PATCHER_RUNS_ON_UPSTREAM || '"ubuntu-24.04"')) }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: patch ${{ matrix.recipe }} ${{ matrix.line }}
    # one patch job per line at a time, across runs (a dispatch while the nightly run is on the same line)
    concurrency:
      group: patch-line-${{ matrix.recipe }}-${{ matrix.line }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # GitHub-hosted only: on a self-hosted runner these would delete the host's files and restart its Docker
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Enable the containerd image store (lets Copa patch locally built images)
        if: runner.environment == 'github-hosted'
        run: |
          echo '{"features":{"containerd-snapshotter":true}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
      - name: Self-hosted runner has the containerd image store
        if: runner.environment != 'github-hosted'
        run: |
          docker info --format '{{json .DriverStatus}}' | grep -q 'io.containerd.snapshotter' || {
            echo "::error::Copa needs Docker's containerd image store on this runner (docs/runbook.md, Self-hosted runners)"
            exit 1
          }
      - uses: ./.github/actions/run-patcher
        with:
          args: >-
            run ${{ matrix.recipe }} --line ${{ matrix.line }} --platform ${{ matrix.platform }}
            --out out --workdir ${{ runner.temp }}/work
          cache-key: ${{ matrix.recipe }}
      # every run's report is visible here, including lines that open no PR (no-changes, image-only)
      - name: Report to the run summary
        if: always()
        env:
          REPORT: out/${{ matrix.recipe }}/${{ matrix.line }}/generated/report.md
        run: |
          if [ -f "$REPORT" ]; then cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          else echo "No report: the run failed before reporting; see the log and the artifact." >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: out-${{ matrix.recipe }}-${{ matrix.line }}
          path: out/${{ matrix.recipe }}/${{ matrix.line }}
          retention-days: 14
          if-no-files-found: warn

  pr:
    needs: [plan, patch]
    if: always() && needs.plan.outputs.count != '0'
    runs-on: ${{ fromJSON(vars.PATCHER_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: pr ${{ matrix.recipe }} ${{ matrix.line }}
    concurrency:
      group: pr-${{ matrix.recipe }}-${{ matrix.line }}
      cancel-in-progress: false
    permissions:
      contents: write        # only used by the GITHUB_TOKEN fallback in open-pr (no upstream code runs here)
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: dl
        continue-on-error: true
        with:
          name: out-${{ matrix.recipe }}-${{ matrix.line }}
          path: out/${{ matrix.recipe }}/${{ matrix.line }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false  # no shared cache: patch jobs, which run upstream code, can write it
        if: steps.dl.outcome == 'success'
      - id: collect
        if: steps.dl.outcome == 'success'
        run: |
          items=$(uv run --project patcher --frozen patcher collect --out out)
          jq . <<<"$items"
          item=$(jq -c '.[0] // empty' <<<"$items")
          [ -n "$item" ] || { echo "nothing generated"; exit 0; }
          {
            echo "found=true"
            echo "tag=$(jq -r .tag <<<"$item")"
            echo "status=$(jq -r .status <<<"$item")"
            echo "draft=$(jq -r .draft <<<"$item")"
            echo "body=$(jq -r .body <<<"$item")"
          } >> "$GITHUB_OUTPUT"
      - if: steps.collect.outputs.found == 'true'
        uses: ./.github/actions/open-pr
        with:
          app-id: ${{ vars.PATCHER_APP_ID }}
          private-key: ${{ secrets.PATCHER_APP_PRIVATE_KEY }}
          branch: patch/${{ matrix.recipe }}/${{ matrix.line }}
          add-paths: generated/${{ matrix.recipe }}/**
          commit-message: "${{ matrix.recipe }} ${{ steps.collect.outputs.tag }}: dependency updates"
          title: "[${{ matrix.recipe }}] ${{ steps.collect.outputs.tag }}: dependency updates (${{ steps.collect.outputs.status }})"
          body-path: ${{ steps.collect.outputs.body }}
          draft: ${{ steps.collect.outputs.draft }}
          labels: security, automated, ${{ matrix.recipe }}${{ steps.collect.outputs.status == 'tests-preexisting' && ', preexisting-test-failures' || '' }}
