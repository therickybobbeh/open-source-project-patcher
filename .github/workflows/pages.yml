# The onboarding site (site/): one self-contained page, plus what is released now (releases.json, from state/).
# No upstream code runs here. GitHub Pages must be on, with "GitHub Actions" as its source (Settings > Pages).
name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "state/**"
      - "recipes/**"
      - "scripts/site_data.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ${{ fromJSON(vars.PATCHER_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write     # publish the site
      id-token: write  # deploy-pages proves to Pages where the deployment comes from
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false  # no shared cache in a job that can write: patch jobs, which run upstream code, can write it
      - name: What is released now
        run: uv run --project patcher --frozen python scripts/site_data.py site/releases.json
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
