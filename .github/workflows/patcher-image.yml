# CI for the patcher itself (unit tests, config validation, schema drift) and publication of the
# portable patcher image (multi-arch, signed) for use from other CI systems.
name: patcher-image

on:
  # every PR: `test` is the check branch protection requires, and a PR that never ran it could never merge
  # (patch PRs touch only generated/, docs PRs only docs/ or wiki/)
  pull_request:
  push:
    branches: [main]
    paths: ["patcher/**"]
  schedule:
    - cron: "0 4 * * 1"   # weekly rebuild picks up base image fixes
  workflow_dispatch:

permissions:
  contents: read

# one publish per ref at a time, in order (two quick merges raced to move :main); PR runs cancel older ones
concurrency:
  group: patcher-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ fromJSON(vars.PATCHER_RUNS_ON_UPSTREAM || '"ubuntu-24.04"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner pools are kept apart
        env:
          PATCHER_RUNS_ON: ${{ vars.PATCHER_RUNS_ON }}
          PATCHER_RUNS_ON_ARM64: ${{ vars.PATCHER_RUNS_ON_ARM64 }}
          PATCHER_RUNS_ON_UPSTREAM: ${{ vars.PATCHER_RUNS_ON_UPSTREAM }}
          PATCHER_RUNS_ON_UPSTREAM_ARM64: ${{ vars.PATCHER_RUNS_ON_UPSTREAM_ARM64 }}
        run: scripts/check-runner-pools.sh
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false  # no shared cache: patch jobs, which run upstream code, can write it
      - run: uv run --project patcher --frozen pytest -q patcher/tests
      - run: uv run --project patcher --frozen patcher validate
      - name: Schemas are up to date
        run: |
          uv run --project patcher --frozen patcher schema --out schema
          git diff --exit-code schema || { echo "run: patcher schema --out schema"; exit 1; }
      - name: Lock file matches pyproject
        run: cd patcher && uv lock --check

  image:
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        arch:
          - { platform: linux/amd64 }
          - { platform: linux/arm64 }
    runs-on: ${{ fromJSON(matrix.arch.platform == 'linux/arm64' && (vars.PATCHER_RUNS_ON_ARM64 || '"ubuntu-24.04-arm"') || (vars.PATCHER_RUNS_ON || '"ubuntu-24.04"')) }}
    timeout-minutes: 60
    environment:  # admits main only (docs/runbook.md, "The release environment")
      name: release
      deployment: false  # no deployment records; the branch policy and its secrets apply all the same
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          REPO: ghcr.io/${{ github.repository_owner }}/patcher
          PLATFORM: ${{ matrix.arch.platform }}
        run: |
          repo="${REPO,,}"
          arch="${PLATFORM#linux/}"
          docker buildx build --platform "$PLATFORM" --provenance=false \
            -t "$repo:${GITHUB_SHA::12}-$arch" --push patcher

  manifest:
    needs: image
    runs-on: ${{ fromJSON(vars.PATCHER_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    environment:  # admits main only (docs/runbook.md, "The release environment")
      name: release
      deployment: false  # no deployment records; the branch policy and its secrets apply all the same
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - env:
          REPO: ghcr.io/${{ github.repository_owner }}/patcher
        run: |
          repo="${REPO,,}"
          tag="${GITHUB_SHA::12}"
          docker buildx imagetools create -t "$repo:$tag" -t "$repo:main" "$repo:$tag-amd64" "$repo:$tag-arm64"
          digest=$(docker buildx imagetools inspect "$repo:$tag" --format '{{json .Manifest}}' | jq -r .digest)
          scripts/retry.sh 3 cosign sign --yes "$repo@$digest"
          echo "published $repo:$tag ($digest)" >> "$GITHUB_STEP_SUMMARY"
