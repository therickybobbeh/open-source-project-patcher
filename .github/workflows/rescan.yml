# Daily: re-scan every published image. New fixable OS CVEs only -> fast Copa re-patch to the next
# revision (no source rebuild). New fixable language CVEs -> dispatch the source flow (patch.yml).
name: rescan

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  PATCHER_REGISTRY: ghcr.io/${{ github.repository_owner }}
  PATCHER_PLATFORMS: ${{ vars.PATCHER_PLATFORMS }}   # e.g. linux/arm64: only these platforms (unset: each recipe's)

jobs:
  scan:
    runs-on: ${{ fromJSON(vars.PATCHER_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 60
    outputs:
      refresh: ${{ steps.r.outputs.refresh }}
      rerun: ${{ steps.r.outputs.rerun }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/run-patcher
        with:
          args: rescan --out out/rescan
          image-cache: "false"  # its results decide refreshes: no cache patch jobs can write (Trivy DB, patcher image)
      - name: Image coverage (inventory.yaml) to the run summary
        if: always()
        run: docker run --rm -v "$PWD:$PWD" -w "$PWD" patcher:ci coverage >> "$GITHUB_STEP_SUMMARY"
      - id: r
        run: |
          result=$(cat out/rescan/result.json)
          echo "refresh=$(jq -c '{include: .refresh}' <<<"$result")" >> "$GITHUB_OUTPUT"
          echo "rerun=$(jq -c '.rerun' <<<"$result")" >> "$GITHUB_OUTPUT"
          jq . <<<"$result"

  # upstream release lines no recipe tracks (v3.6 shipped, recipes follow v3.5): one issue each
  new-lines:
    runs-on: ${{ fromJSON(vars.PATCHER_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false  # no shared cache: patch jobs, which run upstream code, can write it
      - name: Report and track new release lines
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --project patcher --frozen patcher new-lines >> "$GITHUB_STEP_SUMMARY"
          uv run --project patcher --frozen patcher new-lines --json > "$RUNNER_TEMP/new-lines.json"
          scripts/line-issues.sh "$RUNNER_TEMP/new-lines.json"

  # runtimes the recipes build with (Dockerfile bases after minVersions, toolchains) that are end-of-life, or will
  # be within 90 days, per endoflife.date: one issue each. A lookup that fails fails the job, so no issue closes
  eol:
    runs-on: ${{ fromJSON(vars.PATCHER_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false  # no shared cache: patch jobs, which run upstream code, can write it
      - name: Report and track end-of-life runtimes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --project patcher --frozen patcher eol >> "$GITHUB_STEP_SUMMARY"
          uv run --project patcher --frozen patcher eol --json > "$RUNNER_TEMP/eol.json"
          scripts/eol-issues.sh "$RUNNER_TEMP/eol.json"

  refresh:
    needs: scan
    if: fromJSON(needs.scan.outputs.refresh).include[0] != null
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scan.outputs.refresh) }}
    runs-on: ${{ fromJSON(vars.PATCHER_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 120
    name: copa refresh ${{ matrix.recipe }} ${{ matrix.line }}
    permissions:
      contents: write        # only used by the GITHUB_TOKEN fallback in open-pr (the state PR)
      pull-requests: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/run-patcher
        with:
          args: refresh ${{ matrix.recipe }} --line ${{ matrix.line }} --out out
          image-cache: "false"   # this job pushes and signs: it reads no cache other jobs can write
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign refreshed images
        run: |
          jq -r '.[] | .repository + "@" + .digest' "out/${{ matrix.recipe }}/${{ matrix.line }}/release.json" \
            | xargs -r -n1 scripts/retry.sh 3 cosign sign --yes
      - uses: ./.github/actions/open-pr
        with:
          app-id: ${{ vars.PATCHER_APP_ID }}
          private-key: ${{ secrets.PATCHER_APP_PRIVATE_KEY }}
          branch: state/${{ matrix.recipe }}/${{ matrix.line }}-refresh
          add-paths: state/${{ matrix.recipe }}/${{ matrix.line }}.yaml
          commit-message: "state: copa refresh ${{ matrix.recipe }} ${{ matrix.line }}"
          title: "[${{ matrix.recipe }}] copa refresh of ${{ matrix.line }}"
          body-path: out/${{ matrix.recipe }}/${{ matrix.line }}/release.json
          labels: automated, release

  rerun:
    needs: scan
    if: needs.scan.outputs.rerun != '[]'
    runs-on: ${{ fromJSON(vars.PATCHER_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RERUN: ${{ needs.scan.outputs.rerun }}
        run: |
          jq -c '.[]' <<<"$RERUN" | while read -r t; do
            gh workflow run patch.yml -R "$GITHUB_REPOSITORY" -f recipe="$(jq -r .recipe <<<"$t")" -f line="$(jq -r .line <<<"$t")"
          done
