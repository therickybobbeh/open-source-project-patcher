# Daily: re-scan every published image. New fixable OS CVEs only -> a Copa refresh to the next revision (no source
# rebuild), which release.yml runs, signs, attests and records like a release. New fixable language CVEs -> dispatch
# the source flow (patch.yml). This workflow itself publishes nothing: it holds no registry write, signing or App
# credentials.
name: rescan

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  PATCHER_REGISTRY: ghcr.io/${{ github.repository_owner }}
  PATCHER_PLATFORMS: ${{ vars.PATCHER_PLATFORMS }}   # e.g. linux/arm64: only these platforms (unset: each recipe's)

jobs:
  scan:
    runs-on: ${{ fromJSON(vars.PATCHER_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 60
    outputs:
      refresh: ${{ steps.r.outputs.refresh }}
      rerun: ${{ steps.r.outputs.rerun }}
      errors: ${{ steps.r.outputs.errors }}
    permissions:
      contents: read
      packages: read
      pull-requests: read   # which lines have a state PR waiting
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A line whose state PR isn't merged yet is skipped: state/ on main still records the revision before, and a
      # refresh from there would publish an older build again (the refresh would stop anyway: its moving tag moved on)
      - name: Lines with a state PR waiting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          gh pr list -R "$GITHUB_REPOSITORY" --state open --limit 200 --json files --jq '.[].files[].path' \
            | { grep -E '^state/[^/]+/[^/]+\.yaml$' || true; } > out/pending-state.txt
          cat out/pending-state.txt
      - uses: ./.github/actions/run-patcher
        with:
          args: rescan --out out/rescan --pending out/pending-state.txt
          image-cache: "false"  # its results decide refreshes: no cache patch jobs can write (Trivy DB, patcher image)
      - name: Image coverage (inventory.yaml) to the run summary
        if: always()
        run: docker run --rm -v "$PWD:$PWD" -w "$PWD" patcher:ci coverage >> "$GITHUB_STEP_SUMMARY"
      - id: r
        run: |
          result=$(cat out/rescan/result.json)
          {
            echo "refresh=$(jq -c '{include: .refresh}' <<<"$result")"
            echo "rerun=$(jq -c '.rerun' <<<"$result")"
            echo "errors=$(jq -c '.errors' <<<"$result")"
          } >> "$GITHUB_OUTPUT"
          jq . <<<"$result"
          jq -r '.pending[] | "::notice::not rescanned: \(.recipe) \(.line) (its state PR is not merged yet)"' <<<"$result"

  # A line that couldn't be scanned (an unreadable recipe or state file, a scan that failed) doesn't hold up the
  # others. This job fails for it, which raises a CI alert, and passes (closing the alert) once every line scans again.
  scan-errors:
    needs: scan
    runs-on: ${{ fromJSON(vars.PATCHER_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every line was scanned
        env:
          ERRORS: ${{ needs.scan.outputs.errors }}
        run: |
          jq -r '.[] | "::error::cannot rescan \(.recipe) \(.line): \(.error)"' <<<"${ERRORS:-[]}"
          [ "$(jq length <<<"${ERRORS:-[]}")" = 0 ]

  # upstream release lines no recipe tracks (v3.6 shipped, recipes follow v3.5): one issue each
  new-lines:
    runs-on: ${{ fromJSON(vars.PATCHER_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false  # no shared cache: patch jobs, which run upstream code, can write it
      - name: Report and track new release lines
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --project patcher --frozen patcher new-lines >> "$GITHUB_STEP_SUMMARY"
          uv run --project patcher --frozen patcher new-lines --json > "$RUNNER_TEMP/new-lines.json"
          scripts/line-issues.sh "$RUNNER_TEMP/new-lines.json"

  # runtimes the recipes build with (Dockerfile bases after minVersions, toolchains) that are end-of-life, or will
  # be within 90 days, per endoflife.date: one issue each. A lookup that fails fails the job, so no issue closes
  eol:
    runs-on: ${{ fromJSON(vars.PATCHER_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false  # no shared cache: patch jobs, which run upstream code, can write it
      - name: Report and track end-of-life runtimes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --project patcher --frozen patcher eol >> "$GITHUB_STEP_SUMMARY"
          uv run --project patcher --frozen patcher eol --json > "$RUNNER_TEMP/eol.json"
          scripts/eol-issues.sh "$RUNNER_TEMP/eol.json"

  # Each refresh runs in release.yml, which signs it, attaches its SBOM and OpenVEX, attests its provenance, moves the
  # moving tag and records it, as for a release, under the line's release locks. Dispatching needs nothing more.
  refresh:
    needs: scan
    if: fromJSON(needs.scan.outputs.refresh).include[0] != null
    runs-on: ${{ fromJSON(vars.PATCHER_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REFRESH: ${{ needs.scan.outputs.refresh }}
        run: |
          jq -c '.include[]' <<<"$REFRESH" | while read -r t; do
            recipe=$(jq -r .recipe <<<"$t") line=$(jq -r .line <<<"$t")
            gh workflow run release.yml -R "$GITHUB_REPOSITORY" -f recipe="$recipe" -f line="$line" -f refresh=true
            echo "::notice::dispatched a Copa refresh of $recipe $line (release.yml)"
          done

  rerun:
    needs: scan
    if: needs.scan.outputs.rerun != '[]'
    runs-on: ${{ fromJSON(vars.PATCHER_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RERUN: ${{ needs.scan.outputs.rerun }}
        run: |
          jq -c '.[]' <<<"$RERUN" | while read -r t; do
            gh workflow run patch.yml -R "$GITHUB_REPOSITORY" -f recipe="$(jq -r .recipe <<<"$t")" -f line="$(jq -r .line <<<"$t")"
          done
