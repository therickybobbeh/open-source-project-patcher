# yaml-language-server: $schema=../schema/skips.schema.json
# Tests skipped when running strimzi's upstream suite. `match` is a Surefire exclude pattern, e.g. '**/FooTest.java' or 'FooTest#method' (written to -Dsurefire.excludesFile).
# Every entry needs a reason and an owner; set `expires` so skips get revisited.
# Example:
#   - match: '...'
#     reason: needs a cloud account / flaky against live service / unrelated to our use
#     owner: platform-team
#     expires: 2027-01-31
skips: []
quarantine: []
