# yaml-language-server: $schema=../schema/skips.schema.json
# Tests skipped when running apollo-router's upstream suite. `match` is a test-name regex (becomes nextest -E 'not test(/regex/)'); use `filter:` for a raw filterset.
# Every entry needs a reason and an owner; set `expires` so skips get revisited.
# Example:
#   - match: '...'
#     reason: needs a cloud account / flaky against live service / unrelated to our use
#     owner: platform-team
#     expires: 2027-01-31
skips: []
quarantine: []
