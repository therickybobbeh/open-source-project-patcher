# yaml-language-server: $schema=../schema/skips.schema.json
# Tests skipped when running apollo-router's upstream suite. `match` is a test-name regex (becomes nextest -E 'not test(/regex/)'); use `filter:` for a raw filterset.
# Every entry needs a reason and an owner; set `expires` so skips get revisited.
# Example:
#   - match: '...'
#     reason: needs a cloud account / flaky against live service / unrelated to our use
#     owner: platform-team
#     expires: 2027-01-31
skips:
  - match: 'integration::connectors::authentication::test_aws_sig_v4_signing$'
    reason: Calls live AWS (STS AssumeRole, then a SigV4-signed EC2 DescribeInstances) with upstream CI's role (AWS_ROLE_ARN); see tests/integration/fixtures/connectors_sigv4.router.yaml. Fails the same on the unpatched source
    owner: platform-team
    expires: 2027-04-30
quarantine: []
