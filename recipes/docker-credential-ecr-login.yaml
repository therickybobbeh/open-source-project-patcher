# yaml-language-server: $schema=../schema/recipe.schema.json
name: docker-credential-ecr-login
description: Amazon ECR credential helper bundled in other images (component of apollo-operator)
mode: component
source:
  repo: awslabs/amazon-ecr-credential-helper
  lines:   # only used for standalone runs; parents pick the exact version they bundle
    - tagPattern: '^v0\.\d+\.\d+$'
ecosystems:
  - type: gomod
    dirs: [ecr-login]
tests:
  framework: go
  command: cd ecr-login && go test {{skip_args}} ./...
  timeoutMinutes: 30
artifact:
  builder: "golang:{{go}}"
  build: >-
    cd ecr-login && CGO_ENABLED=0 GOOS=$TARGETOS GOARCH=$TARGETARCH go build -trimpath
    -ldflags "-s -w -X github.com/awslabs/amazon-ecr-credential-helper/ecr-login/version.Version={{version}}"
    -o /out/docker-credential-ecr-login ./cli/docker-credential-ecr-login
  output: /out/docker-credential-ecr-login
