# yaml-language-server: $schema=../schema/recipe.schema.json
name: external-secrets
description: External Secrets Operator (ghcr.io/external-secrets/external-secrets)
source:
  repo: external-secrets/external-secrets
  exclude: ['^helm-chart']
  lines:
    - name: v2
      tagPattern: '^v2\.\d+\.\d+$'
toolchain:
  go: "1.27"
ecosystems:
  # root + every provider/generator module (each has its own go.mod, wired in with `replace`)
  - type: gomod
    dirs: [".", "apis", "runtime", "providers/v1/*", "generators/v1/*"]
  - type: dockerfile
    files: [Dockerfile]
holds:
  gomod:
    - name: k8s.io/kube-openapi
      reason: upstream pins it (root go.mod, providers and `make go-work`) to stay on structured-merge-diff v6
scan:
  skipDirs: [e2e, hack]
tests:
  framework: go
  # `make test` regenerates code, downloads envtest (kube-apiserver + etcd), builds a go.work over all
  # modules and runs `go test -tags all_providers work -race`. It takes no extra flags, so test skips
  # are not supported for this recipe; the runner refuses a non-empty skips/external-secrets.yaml.
  command: make test
  timeoutMinutes: 90
build:
  platforms: [linux/amd64, linux/arm64]
  images:
    - name: external-secrets
      upstream: ghcr.io/external-secrets/external-secrets
      # Build the binary like `make build-<arch>` (but without `generate`, the generated code is
      # committed), with the workspace off: `make test` leaves a go.work behind.
      command: >-
        GOWORK=off CGO_ENABLED=0 GOOS=linux GOARCH={{arch}}
        go build -tags all_providers -o bin/external-secrets-linux-{{arch}} main.go &&
        docker buildx build --platform {{platform}} -f Dockerfile -t {{image}} --load .
      builtImage: "{{image}}"
      smoke: ["--help"]
notes:
  - Upstream publishes release images by promoting main-branch builds; ours are built from the release tag.
  - Never build Dockerfile.standalone; it compiles without `-tags all_providers` and ships no providers.
