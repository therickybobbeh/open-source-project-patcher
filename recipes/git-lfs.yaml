# yaml-language-server: $schema=../schema/recipe.schema.json
name: git-lfs
description: Git LFS bundled in other images (component of argo-cd)
mode: component
source:
  repo: git-lfs/git-lfs
  lines:   # only used for standalone runs; parents pick the exact version they bundle
    - tagPattern: '^v3\.\d+\.\d+$'
ecosystems:
  - type: gomod
    dirs: ["."]
scan:
  skipDirs: [t, script, docs]
tests:
  framework: go
  # Go unit tests; the shell integration suite under t/ needs a git build matrix and is not run.
  # -vet=off: stdlib fixes move the build to a newer Go, whose vet flags gotext.Get calls in commands/
  # as printf-format errors (a lint change, not a behavior change; upstream builds with an older Go)
  command: go test -vet=off {{skip_args}} ./...
  timeoutMinutes: 45
artifact:
  builder: "golang:{{go}}"
  build: >-
    CGO_ENABLED=0 GOOS=$TARGETOS GOARCH=$TARGETARCH go build -trimpath
    -ldflags "-s -w -X github.com/git-lfs/git-lfs/v3/config.GitCommit=$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
    -o /out/git-lfs .
  output: /out/git-lfs
