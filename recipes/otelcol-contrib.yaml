# yaml-language-server: $schema=../schema/recipe.schema.json
name: otelcol-contrib
description: OpenTelemetry Collector, contrib distribution (otel/opentelemetry-collector-contrib)
source:
  repo: open-telemetry/opentelemetry-collector-releases
  lines:
    - name: v0.153  # the version we run
      tagPattern: '^v0\.153\.\d+$'
    - name: v0  # the newest release, to upgrade to
      tagPattern: '^v0\.\d+\.\d+$'
toolchain:
  go: "1.26"
# The collector is generated by the OpenTelemetry Collector Builder (ocb) from manifest.yaml (247 components)
# and has no committed go.mod. ocb must be the release's own version (OTELCOL_BUILDER_VERSION in the Makefile).
# Upstream generates into _build/, which .gitignore excludes: the bumps would then never reach deps.patch or the
# image, so the module is generated into gen/ instead, and the run stops if gen/ is ignored.
prepare:
  - >-
    cd distributions/otelcol-contrib &&
    ocb_version=$(sed -n 's/^OTELCOL_BUILDER_VERSION ?= *//p' ../../Makefile) &&
    ocb_bin=$(mktemp -d) &&
    GOBIN="$ocb_bin" go install "go.opentelemetry.io/collector/cmd/builder@v${ocb_version}" &&
    yq -i '.dist.output_path = "./gen"' manifest.yaml &&
    "$ocb_bin/builder" --skip-compilation --config manifest.yaml &&
    ! git check-ignore -q gen/go.mod
ecosystems:
  - type: gomod
    dirs: [distributions/otelcol-contrib/gen]
  - type: dockerfile
    files: [distributions/otelcol-contrib/Dockerfile]
holds:
  gomod:
    # the OpenTelemetry Go log SDK moves in lockstep with its exporters and bridges (otlploghttp, stdoutlog, otelzap):
    # bumping these two alone (v0.19 -> v0.21) broke the build. Newer collector releases (the v0 line) ship them fixed
    - name: go.opentelemetry.io/otel/sdk/log
      reason: moves in lockstep with the log exporters and bridges; bumped alone it breaks the build (fixed in newer collector releases)
    - name: go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploggrpc
      reason: same lockstep as go.opentelemetry.io/otel/sdk/log
scan:
  skipDirs: [internal/tools, tests]  # release tooling and MSI tests, not in the image
  skipFiles: [go.mod, go.sum]  # the repo's own release-tooling module (GoReleaser Pro), not in the image
  reachability: false  # govulncheck over ~1,000 modules takes longer than its VEX hints are worth here
build:
  timeoutMinutes: 90
  images:
    - name: opentelemetry-collector-contrib
      upstream: otel/opentelemetry-collector-contrib
      upstreamTag: "{{version}}"
      # upstream builds with GoReleaser Pro: the same flags, then the distribution's Dockerfile copies the binary
      # (scratch + CA certificates + the default config); like upstream's binary, no `grpcnotrace` tag
      command: >-
        cd distributions/otelcol-contrib &&
        GOWORK=off CGO_ENABLED=0 GOOS=linux GOARCH={{arch}}
        go build -C gen -trimpath -ldflags "-s -w" -o ../otelcol-contrib . &&
        docker buildx build --platform {{platform}} -f Dockerfile -t {{image}} --load .
      builtImage: "{{image}}"
      smoke: ["--version", "components", "validate --config /etc/otelcol-contrib/config.yaml"]
notes:
  - The generated module has no tests of its own (the components' tests live in opentelemetry-collector-contrib, 1,000+ modules); the build, `components` and `validate` against the default config are the checks.
  - Releases come every two weeks. The v0 line follows the newest; the pinned line patches the version we run.
