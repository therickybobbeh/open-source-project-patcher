# yaml-language-server: $schema=../schema/recipe.schema.json
name: argo-cd
description: Argo CD (quay.io/argoproj/argocd)
source:
  repo: argoproj/argo-cd
  # list the release lines you actually run; each gets its own PR, state and tags
  lines:
    - name: v3.6
    - name: v3.5
    - name: v3.4
toolchain:
  go: "1.26"
  node: "24"
  # pnpm: each line's own, from ui/package.json `packageManager` (v3.5 10.28.1, v3.6 12.3.4): a lockfile is only
  # rewritten correctly by the pnpm major that wrote it
  yarn: "1.22.22"   # v3.4's UI is yarn classic (ui/yarn.lock)
ecosystems:
  - type: gomod
    dirs: [".", "gitops-engine"]
    # ~35 k8s.io/* modules are pinned with `replace` at one shared version: they move together
    replaceGroups:
      - pattern: '^k8s\.io/'
  - type: pnpm
    dirs: [ui]
  # v3.4's UI predates the move to pnpm: without this its ui/yarn.lock (bundled into the image) was never patched.
  # Each adapter only touches directories holding its own lockfile, so each line gets the one it has
  - type: yarn
    dirs: [ui]
  - type: dockerfile
    files: [Dockerfile]
    # v3.4 builds its UI on node:23.0.0, end-of-life since 2025-06 (v3.5 is on 24). 24 is LTS until 2028-04 and
    # still ships yarn classic, which v3.4's UI stage runs; node 26 images have no yarn
    minVersions: {node: "24"}
scan:
  skipDirs: [hack/tools, hack/get-previous-release, test/e2e, docs, ui-test]  # ui-test: the UI's end-to-end suite
regen: []
# k8s minor bumps may need `make codegen-local` (protoc, vendoring); patch bumps don't. To enable:
#   - when: replaceGroupMoved
#     run: ["make install-codegen-tools-local", "make codegen-local"]
tests:
  framework: go
  setup: ["make install-test-tools-local"]   # helm, kustomize, gotestsum, oras into $BIN (needs sudo or root)
  command: make test-local                    # gitops-engine module + every non-e2e package, with -race
  # several tests assert "permission denied" (unreadable files, non-executable plugins), which root bypasses
  runAs: nonroot
  # hack/test.sh splices $TEST_FLAGS into `go test` unquoted: no spaces in skip regexes
  skipVia: { env: TEST_FLAGS, format: "-skip={{skip_regex}}" }
  env:
    BIN: /usr/local/bin
  junit: ["test-results/junit.xml"]
  timeoutMinutes: 120
build:
  platforms: [linux/amd64, linux/arm64]
  images:
    - name: argocd
      upstream: quay.io/argoproj/argocd
      args: { GIT_TAG: "{{tag}}", GIT_COMMIT: "{{commit}}", GIT_TREE_STATE: clean }
      smoke: ["argocd version --client"]
# helm, kustomize and git-lfs are downloaded prebuilt (hack/tool-versions.sh). They are rebuilt from source
# at the same version with patched dependencies and swapped into the image (see components in docs/recipes.md).
components:
  - recipe: helm
    path: /usr/local/bin/helm
    # v3.4 bundles helm 3 (helm3_version=3.19.4), whose binary carries no Go build-info version, so it was never
    # rebuilt; v3.5 bundles helm 4 (helm4_version); v3.6 renamed the variables (HELM_VERSION, KUSTOMIZE_VERSION, ...)
    versionFrom: { file: hack/tool-versions.sh, pattern: '^(?:helm[34]_version|HELM_VERSION)=v?(?P<version>\S+)$' }
  - recipe: kustomize
    path: /usr/local/bin/kustomize
    tag: "kustomize/v{{version}}"
    versionFrom: { file: hack/tool-versions.sh, pattern: '^(?:kustomize5_version|KUSTOMIZE_VERSION)=v?(?P<version>\S+)$' }
    versionCommand: [version]
  - recipe: git-lfs
    path: /usr/local/bin/git-lfs
    versionFrom: { file: hack/tool-versions.sh, pattern: '^(?:git_lfs_version|GIT_LFS_VERSION)=v?(?P<version>\S+)$' }
    versionCommand: [version]
notes:
  - helm, kustomize and git-lfs are rebuilt from source at the versions in hack/tool-versions.sh (components); moving to a newer tool version still needs a patch that updates tool-versions.sh and hack/installers/checksums/.
  - End-to-end tests (k3s cluster) are not part of `make test-local` and are not run.
