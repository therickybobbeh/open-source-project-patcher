# yaml-language-server: $schema=../schema/recipe.schema.json
name: docker-credential-gcr
description: Google Container Registry credential helper bundled in other images (component of apollo-operator)
mode: component
source:
  repo: GoogleCloudPlatform/docker-credential-gcr
  lines:   # only used for standalone runs; parents pick the exact version they bundle
    - tagPattern: '^v2\.\d+\.\d+$'
ecosystems:
  - type: gomod
    dirs: ["."]
tests:
  framework: go
  # as upstream CI (test.yml): test/ runs end-to-end tests against ../docker-credential-gcr and expects the
  # helper on PATH, so build it first (into the checkout, not the shared GOPATH)
  command: go build -o docker-credential-gcr . && PATH="$PWD:$PATH" go test {{skip_args}} ./...
  timeoutMinutes: 30
artifact:
  builder: "golang:{{go}}"
  build: >-
    CGO_ENABLED=0 GOOS=$TARGETOS GOARCH=$TARGETARCH go build -trimpath
    -ldflags "-s -w -X github.com/GoogleCloudPlatform/docker-credential-gcr/v2/config.Version={{version}}"
    -o /out/docker-credential-gcr .
  output: /out/docker-credential-gcr
